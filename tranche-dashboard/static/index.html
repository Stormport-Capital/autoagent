<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tranche Dashboard</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --ink: #16181d; --ink-2: #4a505c; --muted: #7a808c;
  --line: #e3e6eb; --accent: #2f5fd0; --good: #1a7f4b; --bad: #c0362c; --warn: #9a6700;
  --chip: #eef1f6; --series: #2f5fd0; --series-2: #c2620b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --surface: #171a20; --ink: #e8eaee; --ink-2: #b4bac4; --muted: #858c98;
    --line: #2a2f38; --accent: #7aa2ff; --good: #4cc38a; --bad: #ff6b5e; --warn: #e3b341;
    --chip: #222730; --series: #3987e5; --series-2: #d95926;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline;
  padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
header h1 { font-size: 17px; margin: 0; }
header .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }
header .spacer { flex: 1; }
main { padding: 16px 20px 40px; display: grid; gap: 16px; max-width: 1500px; margin: 0 auto; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.kpi .l { color: var(--muted); font-size: 12px; }
.kpi .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .s { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
@media (max-width: 980px) { .grid2 { grid-template-columns: 1fr; } }
section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
section.card h2 { font-size: 14px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
section.card h2 small { color: var(--muted); font-weight: 400; }
label { display: block; font-size: 12.5px; color: var(--ink-2); margin: 8px 0 3px; }
input, select, textarea, button { font: inherit; color: var(--ink); }
input, select, textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg); }
textarea { resize: vertical; min-height: 54px; text-transform: uppercase; }
button { border: 1px solid var(--line); background: var(--chip); border-radius: 6px;
  padding: 6px 10px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.small { padding: 2px 7px; font-size: 12px; }
header button, td button { white-space: nowrap; }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg label { flex: 1; margin: 0; text-align: center; padding: 6px; cursor: pointer; color: var(--ink-2); }
.seg input { display: none; }
.seg label:has(input:checked) { background: var(--accent); color: #fff; }
.hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
.msg { font-size: 12.5px; margin-top: 8px; min-height: 1em; }
.msg.err { color: var(--bad); } .msg.ok { color: var(--good); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
tbody tr:hover { background: var(--chip); }
.pos { color: var(--good); } .neg { color: var(--bad); }
.pill { display: inline-block; border-radius: 10px; padding: 1px 7px; font-size: 11.5px;
  background: var(--chip); color: var(--ink-2); margin-right: 3px; }
.pill.short { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.pill.long { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.sym { font-weight: 600; }
.err-text { color: var(--bad); font-size: 12px; white-space: normal; max-width: 260px; }
.chart { position: relative; }
.chart svg { width: 100%; height: 220px; display: block; }
.chart .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; white-space: nowrap; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.booktabs button { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; }
.booktabs small { font-size: 11px; opacity: .85; font-variant-numeric: tabular-nums; }
.checks { display: flex; gap: 14px; margin-top: 2px; }
.checks label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--ink); }
.checks input { width: auto; }
select.gradesel { width: auto; padding: 1px 4px; font-size: 12px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); font-weight: 400; }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; }
.switch { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--ink); font-size: 13px; cursor: pointer; }
.switch input { width: auto; }
.bk-kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 12px; margin: 10px 0; font-variant-numeric: tabular-nums; }
.bk-kpis div span { display: block; color: var(--muted); font-size: 11.5px; }
.tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.log td { white-space: normal; text-align: left; }
.log td.ts { white-space: nowrap; color: var(--muted); }
.empty { color: var(--muted); padding: 10px 0; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Tranche Dashboard</h1>
  <div class="tabs booktabs" id="bookTabs"></div>
  <div class="meta" id="meta"></div>
  <div class="spacer"></div>
  <div class="row" style="flex:0">
    <button id="demoPause" style="display:none">Pause demo</button>
    <button id="runNow">Check now</button>
  </div>
</header>
<main>
  <div class="kpis" id="kpis"></div>

  <div class="grid2">
    <div style="display:grid; gap:16px">
      <section class="card">
        <h2>Add symbols</h2>
        <form id="addForm">
          <label for="symbols">Symbols (comma or space separated)</label>
          <textarea id="symbols" placeholder="AAPL, TSLA, NVDA"></textarea>
          <label>EMA crossover direction</label>
          <div class="seg">
            <label><input type="radio" name="mode" value="short_only" checked>Short only</label>
            <label><input type="radio" name="mode" value="long_short">Long &amp; short</label>
          </div>
          <label for="grade">Trade grade (sets risk)</label>
          <select id="grade">
            <option value="A+">A+ · 3% of equity</option>
            <option value="A">A · 2%</option>
            <option value="B" selected>B · 1.5%</option>
            <option value="C">C · 1%</option>
            <option value="custom">Custom (use slider)</option>
          </select>
          <label for="risk">Risk per symbol: <b id="riskOut">1.5</b>% of equity</label>
          <input id="risk" type="range" min="0.5" max="3" step="0.25" value="1.5">
          <div class="hint">Split evenly across the 3 tranches. The VWAP tranche is always short-only.</div>
          <label>Add to</label>
          <div class="checks">
            <label><input type="checkbox" id="toBook1h" checked>Hourly book</label>
            <label><input type="checkbox" id="toBook15m" checked>15-min book</label>
          </div>
          <div style="margin-top:10px"><button class="primary" type="submit">Add to watchlist</button></div>
          <div class="msg" id="addMsg"></div>
        </form>
      </section>

      <section class="card">
        <h2>Portfolio settings</h2>
        <form id="setForm">
          <label for="starting_capital">Portfolio size ($)</label>
          <input id="starting_capital" type="number" min="1000" step="1000">
          <div class="row">
            <div><label for="borrow_rate_pct">Borrow rate (%/yr)</label><input id="borrow_rate_pct" type="number" step="0.5" min="0"></div>
            <div><label for="borrow_day_count">Day count</label>
              <select id="borrow_day_count"><option value="360">360</option><option value="365">365</option></select></div>
          </div>
          <div class="row">
            <div><label for="stop_atr_mult" title="EMA tranches have no stop. Sizing uses each stock's own past cross-to-cross drawdowns; this multiple of ATR is only the fallback when there are fewer than 5 past crosses">EMA fallback size (× ATR)</label><input id="stop_atr_mult" type="number" step="0.25" min="0.25"></div>
            <div><label for="atr_period">ATR period</label><input id="atr_period" type="number" step="1" min="2"></div>
          </div>
          <div class="row">
            <div><label for="max_leverage">Max gross leverage</label><input id="max_leverage" type="number" step="0.5" min="0.1"></div>
            <div><label for="slippage_bps">Slippage (bps)</label><input id="slippage_bps" type="number" step="1" min="0"></div>
          </div>
          <div class="row">
            <div><label for="bar_close_delay_min">Check delay (min)</label><input id="bar_close_delay_min" type="number" step="1" min="0"></div>

          </div>
          <div style="margin-top:10px" class="row">
            <button class="primary" type="submit">Save settings</button>
            <button type="button" id="resetBtn">Reset portfolio</button>
          </div>
          <div class="msg" id="setMsg"></div>
        </form>
      </section>

      <section class="card">
        <h2>Alpaca paper account <small id="bkState"></small></h2>
        <div id="bkBody"></div>
      </section>
    </div>

    <div style="display:grid; gap:16px; min-width:0">
      <section class="card">
        <h2>Watchlist <small id="watchNote"></small></h2>
        <div class="tablewrap"><table id="watch"></table></div>
      </section>

      <section class="card">
        <h2>Equity <span class="legend" id="legend"></span></h2>
        <div class="chart" id="chart"><svg></svg><div class="tip"></div></div>
      </section>

      <section class="card">
        <h2>Performance by tranche</h2>
        <div class="tablewrap"><table id="perf"></table></div>
      </section>
    </div>
  </div>

  <section class="card">
    <h2>
      <div class="tabs">
        <button data-tab="open" class="on">Open positions</button>
        <button data-tab="closed">Closed trades</button>
        <button data-tab="symbols">By symbol</button>
        <button data-tab="orders">Paper orders</button>
        <button data-tab="log">Signal log</button>
      </div>
    </h2>
    <div class="tablewrap" id="tabBody"></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let STATE = null, TAB = "open";
// which book is on screen: "1h" (hourly bars) or "15m"; kept in the URL hash
let BOOK = location.hash === "#15m" ? "15m" : "1h";
const bk = path => path.replace(/^\/api\//, `/api/${BOOK}/`);
const TF = () => (STATE && STATE.book.minutes === 15) ? "15m" : "1h";

const usd = (v, d = 0) => v == null ? "—" :
  (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d});
const signed = (v, d = 0) => v == null ? "—" : (v > 0 ? "+" : "") + usd(v, d);
const pct = (v, d = 1) => v == null ? "—" : (v * 100).toFixed(d) + "%";
const num = (v, d = 2) => v == null ? "—" : Number(v).toFixed(d);
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmtT = iso => { if (!iso) return "—"; const d = new Date(iso);
  return d.toLocaleString(undefined, {month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: "America/New_York"}) + " ET"; };

async function api(path, body) {
  const r = await fetch(path, {method: body === undefined ? "GET" : "POST",
    headers: {"Content-Type": "application/json"}, body: body === undefined ? undefined : JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function refresh() {
  try { STATE = await api(bk("/api/state")); render(); }
  catch (e) { $("#meta").innerHTML = `<span class="neg">Dashboard server unreachable: ${esc(e.message)}</span>`; }
}

function renderBooks(S) {
  $("#bookTabs").innerHTML = S.books.map(b => {
    const r = b.equity / b.start - 1;
    return `<button data-book="${b.key}" class="${b.key === BOOK ? "on" : ""}">${esc(b.label)} book
      <small>${usd(b.equity)} · ${pct(r, 2)}${b.sync_on ? " · paper on" : ""}</small></button>`;
  }).join("");
  document.title = `Tranche Dashboard - ${S.book.label}`;
}

function render() {
  const S = STATE, m = S.summary, o = m.overall;
  renderBooks(S);
  $("#meta").innerHTML = [
    `<span>${S.demo ? '<span class="pill warn">DEMO — synthetic prices, simulated clock</span>' : (S.settings.broker_sync_enabled ? "Model + Alpaca PAPER orders" : "Model only · no orders sent")}</span>`,
    `<span>Data: ${esc(S.provider)}</span>`,
    `<span>${S.demo ? "Sim time" : "Now"}: ${fmtT(S.now)} · market ${S.market_open ? "open" : "closed"}</span>`,
    `<span>Last check: ${fmtT(S.last_tick)}</span>`,
    S.backup ? (S.backup.error ? `<span class="neg">${esc(S.backup.error)}</span>`
      : `<span title="${esc(S.backup.folder)}">Backed up ${fmtT(S.backup.last)}</span>`) : "",
    `<a href="/api/${BOOK}/download.db" title="Download a copy of this book's database">Download backup</a>`,
    `<span>Next: ${fmtT(S.next_tick)}</span>`,
    S.scheduler_error ? `<span class="neg">${esc(S.scheduler_error)}</span>` : ""].join("");
  $("#demoPause").style.display = S.demo ? "" : "none";
  $("#demoPause").textContent = S.paused ? "Resume demo" : "Pause demo";

  const kpi = (l, v, s = "", c = "") => `<div class="kpi"><div class="l">${l}</div><div class="v ${c}">${v}</div><div class="s">${s}</div></div>`;
  $("#kpis").innerHTML =
    kpi("Equity", usd(m.equity), `start ${usd(m.starting_capital)}`) +
    kpi("Total return", pct(m.total_return, 2), signed(m.equity - m.starting_capital), cls(m.total_return)) +
    kpi("Realized P&L", signed(m.realized_net), `${o.trades} closed trades`, cls(m.realized_net)) +
    kpi("Open P&L", signed(m.unrealized), `${m.open.length} open tranches`, cls(m.unrealized)) +
    kpi("Borrow fees", usd(m.borrow_fees, 2), `${S.settings.borrow_rate_pct}%/yr`) +
    kpi("Win rate", pct(o.win_rate, 0), `PF ${o.profit_factor == null ? "—" : num(o.profit_factor)} · avg ${o.avg_r == null ? "—" : num(o.avg_r) + "R"}`) +
    kpi("Max drawdown", pct(-m.max_drawdown, 1), "from equity snapshots", m.max_drawdown > 0 ? "neg" : "") +
    kpi("Exposure", usd(m.gross_long + m.gross_short), `L ${usd(m.gross_long)} · S ${usd(m.gross_short)}`);

  renderSettings(S.settings);
  renderWatch(S);
  renderBroker(S.broker);
  renderChart(m.curve, m.starting_capital, S.broker.curve || []);
  renderPerf(m);
  renderTab();
}

let settingsDirty = false;
function renderSettings(s) {
  if (settingsDirty) return;
  for (const [k, v] of Object.entries(s)) { const el = document.getElementById(k); if (el) el.value = String(v); }
}

function trancheCell(t, sleeve, mode) {
  if (!t) return `<span class="pill">flat</span>`;
  return `<span class="pill ${t.side}" title="entry ${num(t.entry_price)} · ${t.sleeve === "VWAP" ? "stop " + num(t.stop_price) : "exits on the opposite cross"}${t.target_price == null ? "" : " · target " + num(t.target_price)} · ${t.qty} sh">${t.side === "short" ? "S" : "L"} ${t.qty}</span>` +
         `<span class="${cls(t.unrealized)}">${signed(t.unrealized)}</span>`;
}

function renderWatch(S) {
  const f = document.activeElement;
  if (f && f.classList && f.classList.contains("gradesel")) return;  // don't redraw mid-choice
  const rows = S.symbols;
  $("#watchNote").textContent = `${rows.length} symbols · ${STATE.book.label} bars · checked as each bar closes`;
  if (!rows.length) { $("#watch").innerHTML = `<tr><td class="empty">Add symbols to start monitoring.</td></tr>`; return; }
  let h = `<thead><tr><th>Symbol</th><th class="l">Setup</th><th>Last</th><th>EMA 5 / 10 / 20 (${TF()})</th><th>VWAP</th>
    <th class="l">5/10 tranche</th><th class="l">10/20 tranche</th><th class="l">VWAP tranche</th><th>Open P&amp;L</th><th></th></tr></thead><tbody>`;
  for (const s of rows) {
    const n = s.snapshot || {};
    const stack = n.ema5 == null ? "warming up" :
      `<span title="${n.ema5 < n.ema10 ? "5 below 10" : "5 above 10"}; ${n.ema10 < n.ema20 ? "10 below 20" : "10 above 20"}">${num(n.ema5)} / ${num(n.ema10)} / ${num(n.ema20)}</span>`;
    const below = n.vwap != null && s.last_price != null && s.last_price < n.vwap;
    h += `<tr><td><span class="sym">${esc(s.symbol)}</span>${s.status === "paused" ? ' <span class="pill warn">paused</span>' : ""}
        ${s.error ? `<div class="err-text">${esc(s.error)}</div>` : ""}</td>
      <td class="l">${s.mode === "long_short" ? "Long &amp; short" : "Short only"} ·
        <select class="gradesel" data-id="${s.id}" title="Grade sets risk for new entries">
          ${["A+", "A", "B", "C"].map(g => `<option ${s.grade === g ? "selected" : ""}>${g}</option>`).join("")}
          ${s.grade ? "" : `<option selected value="">custom</option>`}
        </select> ${s.risk_pct}%</td>
      <td>${num(s.last_price)}</td><td>${stack}</td>
      <td>${n.vwap == null ? "—" : `<span class="${below ? "neg" : ""}">${num(n.vwap)}</span>`}</td>
      <td class="l">${trancheCell(s.tranches.EMA5_10)}</td>
      <td class="l">${trancheCell(s.tranches.EMA10_20)}</td>
      <td class="l">${trancheCell(s.tranches.VWAP)}</td>
      <td class="${cls(s.unrealized)}">${signed(s.unrealized)}</td>
      <td><button class="small" data-act="bars" data-sym="${esc(s.symbol)}" title="Every bar the engine used, with EMAs, ATR, VWAP and signals">Bars</button>
        <button class="small" data-act="status" data-id="${s.id}" data-v="${s.status === "paused" ? "active" : "paused"}">${s.status === "paused" ? "Resume" : "Pause"}</button>
        <button class="small" data-act="flatten" data-id="${s.id}">Flatten</button>
        <button class="small" data-act="status" data-id="${s.id}" data-v="removed">Remove</button></td></tr>`;
  }
  $("#watch").innerHTML = h + "</tbody>";
}

function renderChart(curve, start, paper) {
  const svg = $("#chart svg"), tip = $("#chart .tip");
  const W = svg.clientWidth || 600, H = 220, P = {l: 64, r: 12, t: 10, b: 24};
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const series = [{name: "Model", color: "var(--series)", pts: curve}];
  if (paper.length) series.push({name: "Alpaca paper", color: "var(--series-2)", pts: paper});
  $("#legend").innerHTML = series.length > 1
    ? series.map(se => `<span><i style="background:${se.color}"></i>${se.name}</span>`).join("") : "";
  const all = series.flatMap(se => se.pts);
  if (all.length < 2) { svg.innerHTML = `<text x="${P.l}" y="${H / 2}" fill="var(--muted)" font-size="13">Equity curve appears after the first checks.</text>`; return; }
  const ts = all.map(p => Date.parse(p.ts)), t0 = Math.min(...ts), t1 = Math.max(...ts) || t0 + 1;
  const ys = all.map(p => p.equity).concat([start]);
  let lo = Math.min(...ys), hi = Math.max(...ys); const pad = (hi - lo) * 0.1 || hi * 0.005; lo -= pad; hi += pad;
  const x = t => P.l + (W - P.l - P.r) * (t1 === t0 ? 1 : (t - t0) / (t1 - t0));
  const y = v => P.t + (H - P.t - P.b) * (1 - (v - lo) / (hi - lo));
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4;
    g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>` +
         `<text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end" fill="var(--muted)" font-size="11">${usd(v)}</text>`; }
  g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(start)}" y2="${y(start)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  const d8 = t => new Date(t).toLocaleDateString(undefined, {month: "short", day: "numeric", timeZone: "America/New_York"});
  g += `<text x="${P.l}" y="${H - 6}" fill="var(--muted)" font-size="11">${d8(t0)}</text>` +
       `<text x="${W - P.r}" y="${H - 6}" text-anchor="end" fill="var(--muted)" font-size="11">${d8(t1)}</text>`;
  for (const [k, se] of series.entries()) {
    if (!se.pts.length) continue;
    const d = se.pts.map((p, i) => `${i ? "L" : "M"}${x(Date.parse(p.ts)).toFixed(1)},${y(p.equity).toFixed(1)}`).join("");
    g += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round"/>` +
         `<circle class="dot" data-k="${k}" r="4" fill="${se.color}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  }
  g += `<line id="xh" y1="${P.t}" y2="${H - P.b}" stroke="var(--muted)" visibility="hidden"/>` +
       `<rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent" id="hit"/>`;
  svg.innerHTML = g;
  const hit = svg.querySelector("#hit"), xh = svg.querySelector("#xh"), dots = svg.querySelectorAll(".dot");
  const nearest = (pts, t) => pts.reduce((b, p) => Math.abs(Date.parse(p.ts) - t) < Math.abs(Date.parse(b.ts) - t) ? p : b, pts[0]);
  hit.onmousemove = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const t = t0 + (t1 - t0) * Math.max(0, Math.min(1, (px - P.l) / (W - P.l - P.r)));
    let html = "", xt = null;
    series.forEach((se, k) => {
      if (!se.pts.length) return;
      const p = nearest(se.pts, t), dot = [...dots].find(el => el.dataset.k == k);
      dot.setAttribute("cx", x(Date.parse(p.ts))); dot.setAttribute("cy", y(p.equity)); dot.setAttribute("visibility", "visible");
      if (xt === null) xt = Date.parse(p.ts);
      html += `${series.length > 1 ? se.name + ": " : ""}<b>${usd(p.equity)}</b>${k === 0 ? ` <span class="${cls(p.equity - start)}">${signed(p.equity - start)}</span>` : ""}<br>`;
    });
    xh.setAttribute("x1", x(xt)); xh.setAttribute("x2", x(xt)); xh.setAttribute("visibility", "visible");
    tip.style.display = "block"; tip.innerHTML = html + fmtT(new Date(xt).toISOString());
    const tx = x(xt) * r.width / W; tip.style.left = Math.min(tx + 10, r.width - 190) + "px"; tip.style.top = "8px";
  };
  hit.onmouseleave = () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); dots.forEach(d => d.setAttribute("visibility", "hidden")); };
}

function renderBroker(B) {
  const on = STATE.settings.broker_sync_enabled;
  if (!B.configured) {
    $("#bkState").textContent = "not linked";
    $("#bkBody").innerHTML = `<div class="hint">${esc(B.reason)}. See SETUP.md.</div>`;
    return;
  }
  const a = B.account;
  $("#bkState").innerHTML = on ? '<span class="pill long">sync on</span>' : '<span class="pill">sync off</span>';
  const mism = (B.reconciliation || []).filter(r => !r.match);
  let h = `<label class="switch"><input type="checkbox" id="bkToggle" ${on ? "checked" : ""}> Send the model's trades to Alpaca paper</label>
    <div class="hint">Paper endpoint only (${esc(B.endpoint)}). Orders are market orders sent right after each ${esc(STATE.book.label)} check.</div>`;
  if (a) h += `<div class="bk-kpis">
      <div><span>Paper equity</span>${usd(a.equity)}</div><div><span>Today</span><b class="${cls(a.day_pl)}">${signed(a.day_pl)}</b></div>
      <div><span>Buying power</span>${usd(a.buying_power)}</div><div><span>Cash</span>${usd(a.cash)}</div></div>`;
  if (a && (a.trading_blocked || a.shorting_enabled === false))
    h += `<div class="msg err">${a.trading_blocked ? "Trading is blocked on this account. " : ""}${a.shorting_enabled === false ? "Shorting is disabled on this account." : ""}</div>`;
  if (B.error) h += `<div class="msg err">${esc(B.error)}</div>`;
  h += `<div class="hint">Last sync: ${fmtT(B.last_sync)} · ${!a || B.error ? '<span class="neg">position check unavailable</span>' : mism.length ? `<span class="neg">${mism.length} symbol(s) differ from the model</span>` : "paper matches the model"}</div>
    <div class="row" style="margin-top:8px"><button type="button" id="bkSync" ${on ? "" : "disabled"}>Sync now</button></div>`;
  if (a && !B.error && (B.reconciliation || []).length) {
    h += `<div class="tablewrap" style="margin-top:8px"><table><thead><tr><th class="l">Symbol</th><th>Model</th><th>Paper</th><th>Paper P&amp;L</th></tr></thead><tbody>` +
      B.reconciliation.map(r => `<tr><td class="sym">${esc(r.symbol)}</td><td>${r.model}</td><td class="${r.match ? "" : "neg"}">${r.paper}</td><td class="${cls(r.unrealized)}">${r.unrealized == null ? "—" : signed(r.unrealized)}</td></tr>`).join("") +
      `</tbody></table></div>`;
  }
  $("#bkBody").innerHTML = h;
  $("#bkToggle").onchange = async e => {
    if (e.target.checked && !confirm("Start sending orders to the Alpaca PAPER account? Any open model positions will be opened there at market.")) { e.target.checked = false; return; }
    try { await api(bk("/api/settings"), {broker_sync_enabled: e.target.checked}); } catch (err) { alert(err.message); }
    refresh();
  };
  $("#bkSync").onclick = async ev => { ev.target.disabled = true; try { await api(bk("/api/broker/sync"), {}); } catch (err) { alert(err.message); } refresh(); };
}

function statRow(name, st, extra = "") {
  return `<tr><td>${name}</td>${extra}<td>${st.trades}</td><td>${pct(st.win_rate, 0)}</td>
    <td class="${cls(st.net_pnl)}">${signed(st.net_pnl)}</td><td>${signed(st.avg_win)}</td><td>${signed(st.avg_loss)}</td>
    <td>${st.profit_factor == null ? "—" : num(st.profit_factor)}</td><td>${st.avg_r == null ? "—" : num(st.avg_r) + "R"}</td>
    <td>${usd(st.borrow_fees, 2)}</td></tr>`;
}
const statHead = extra => `<thead><tr><th class="l"></th>${extra}<th>Trades</th><th>Win %</th><th>Net P&amp;L</th><th>Avg win</th><th>Avg loss</th><th>PF</th><th>Avg R</th><th>Borrow</th></tr></thead>`;

function renderPerf(m) {
  let h = statHead("<th>Open</th>") + "<tbody>";
  for (const [k, st] of Object.entries(m.by_sleeve)) h += statRow(st.label, st, `<td>${st.open}</td>`);
  h += statRow("Longs", m.by_side.long, "<td></td>") + statRow("Shorts", m.by_side.short, "<td></td>");
  h += statRow("<b>All</b>", m.overall, `<td>${m.open.length}</td>`);
  $("#perf").innerHTML = h + "</tbody>";
}

function renderTab() {
  const m = STATE.summary, L = STATE.sleeves;
  document.querySelectorAll(".tabs button[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === TAB));
  let h = "";
  if (TAB === "open") {
    if (!m.open.length) return $("#tabBody").innerHTML = `<div class="empty">No open positions.</div>`;
    h = `<table><thead><tr><th class="l">Symbol</th><th class="l">Tranche</th><th class="l">Side</th><th>Qty</th><th>Entry</th><th>Stop</th><th>Target</th><th>Mark</th>
      <th>Notional</th><th>Risk</th><th>Borrow so far</th><th>Open P&amp;L (net)</th><th class="l">Opened</th></tr></thead><tbody>`;
    for (const t of m.open) h += `<tr><td class="sym">${esc(t.symbol)}</td><td class="l">${L[t.sleeve]}</td><td class="l"><span class="pill ${t.side}">${t.side}</span></td>
      <td>${t.qty}</td><td>${num(t.entry_price)}</td><td>${t.sleeve === "VWAP" ? num(t.stop_price) : "on cross"}</td><td>${num(t.target_price)}</td><td>${num(t.mark)}</td><td>${usd(t.notional)}</td>
      <td>${usd(t.risk_dollars)}</td><td>${usd(t.borrow_fees, 2)}</td><td class="${cls(t.unrealized - t.borrow_fees)}">${signed(t.unrealized - t.borrow_fees)}</td><td class="l">${fmtT(t.entry_time)}</td></tr>`;
  } else if (TAB === "closed") {
    if (!m.closed.length) return $("#tabBody").innerHTML = `<div class="empty">No closed trades yet.</div>`;
    h = `<table><thead><tr><th class="l">Symbol</th><th class="l">Tranche</th><th class="l">Side</th><th>Qty</th><th>Entry</th><th>Exit</th>
      <th>Gross</th><th>Borrow</th><th>Net</th><th>R</th><th class="l">Exit reason</th><th class="l">Opened</th><th class="l">Closed</th></tr></thead><tbody>`;
    for (const t of m.closed) h += `<tr><td class="sym">${esc(t.symbol)}</td><td class="l">${L[t.sleeve]}</td><td class="l"><span class="pill ${t.side}">${t.side}</span></td>
      <td>${t.qty}</td><td>${num(t.entry_price)}</td><td>${num(t.exit_price)}</td><td class="${cls(t.gross_pnl)}">${signed(t.gross_pnl, 2)}</td>
      <td>${usd(t.borrow_fees, 2)}</td><td class="${cls(t.net_pnl)}">${signed(t.net_pnl, 2)}</td><td>${t.r_multiple == null ? "—" : num(t.r_multiple)}</td>
      <td class="l">${esc(t.exit_reason)}</td><td class="l">${fmtT(t.entry_time)}</td><td class="l">${fmtT(t.exit_time)}</td></tr>`;
  } else if (TAB === "symbols") {
    const e = Object.entries(m.by_symbol);
    if (!e.length) return $("#tabBody").innerHTML = `<div class="empty">No closed trades yet.</div>`;
    h = `<table>${statHead("")}<tbody>` + e.map(([k, st]) => statRow(`<span class="sym">${esc(k)}</span>`, st)).join("");
  } else if (TAB === "orders") {
    const os = (STATE.broker && STATE.broker.orders) || [];
    if (!os.length) return $("#tabBody").innerHTML = `<div class="empty">No paper orders yet.</div>`;
    h = `<table><thead><tr><th class="l">Sent</th><th class="l">Symbol</th><th class="l">Side</th><th>Qty</th><th class="l">Status</th><th>Filled</th><th>Avg price</th><th class="l">Why</th></tr></thead><tbody>`;
    for (const o of os) h += `<tr><td class="l">${fmtT(o.ts)}</td><td class="sym">${esc(o.symbol)}</td><td class="l">${o.side}</td><td>${o.qty}</td>
      <td class="l"><span class="pill ${o.status === "filled" ? "long" : o.status === "rejected" ? "short" : "warn"}">${esc(o.status)}</span></td>
      <td>${o.filled_qty ?? "—"}</td><td>${num(o.filled_avg_price)}</td><td class="l" style="white-space:normal">${esc(o.message || o.reason)}</td></tr>`;
  } else {
    const ev = STATE.events;
    if (!ev.length) return $("#tabBody").innerHTML = `<div class="empty">No events yet.</div>`;
    h = `<table class="log"><thead><tr><th class="l">Time</th><th class="l">Symbol</th><th class="l">Tranche</th><th class="l">Event</th><th class="l">Detail</th></tr></thead><tbody>`;
    for (const e of ev) h += `<tr><td class="ts">${fmtT(e.ts)}</td><td class="sym">${esc(e.symbol || "")}</td><td>${e.sleeve ? L[e.sleeve] : ""}</td>
      <td><span class="pill ${e.kind === "entry" ? "short" : e.kind === "error" || e.kind === "skip" ? "warn" : ""}">${esc(e.kind)}</span></td><td>${esc(e.message)}</td></tr>`;
  }
  $("#tabBody").innerHTML = h + "</tbody></table>";
}

// ---- interactions
const GRADES = {"A+": 3, "A": 2, "B": 1.5, "C": 1};
const showRisk = v => $("#riskOut").textContent = Number(v).toFixed(2).replace(/0$/, "");
$("#risk").oninput = e => { showRisk(e.target.value); $("#grade").value = "custom"; };
$("#grade").onchange = e => { const r = GRADES[e.target.value]; if (r) { $("#risk").value = r; showRisk(r); } };
$("#addForm").onsubmit = async e => {
  e.preventDefault(); const msg = $("#addMsg");
  try {
    const targets = [["1h", "Hourly"], ["15m", "15-min"]].filter(([k]) => $(`#toBook${k}`).checked);
    if (!targets.length) throw new Error("Tick at least one book to add to.");
    const body = {symbols: $("#symbols").value,
      mode: document.querySelector("input[name=mode]:checked").value, risk_pct: Number($("#risk").value),
      grade: $("#grade").value};
    const done = [];
    for (const [k, label] of targets) {
      try { const r = await api(`/api/${k}/symbols`, body); done.push(`${label}: ${r.added.join(", ")}`); }
      catch (err) { done.push(`${label}: ${err.message}`); }
    }
    msg.className = "msg ok"; msg.textContent = done.join(" · "); $("#symbols").value = "";
    setTimeout(refresh, 1500);
  } catch (err) { msg.className = "msg err"; msg.textContent = err.message; }
  refresh();
};
document.querySelectorAll("#setForm input, #setForm select").forEach(el => el.oninput = () => settingsDirty = true);
$("#setForm").onsubmit = async e => {
  e.preventDefault(); const msg = $("#setMsg"), body = {};
  for (const el of document.querySelectorAll("#setForm input, #setForm select"))
    body[el.id] = Number(el.value);
  try { await api(bk("/api/settings"), body); settingsDirty = false; msg.className = "msg ok"; msg.textContent = "Saved."; }
  catch (err) { msg.className = "msg err"; msg.textContent = err.message; }
  refresh();
};
$("#resetBtn").onclick = async () => {
  if (!confirm(`Reset the ${STATE.book.label} book? Its trades, history and equity curve are deleted. Its symbols stay and restart from now. The other book is not affected.`)) return;
  await api(bk("/api/reset"), {}); refresh();
};
$("#runNow").onclick = async e => { e.target.disabled = true; try { await api(bk("/api/tick"), {}); } finally { e.target.disabled = false; refresh(); } };
$("#demoPause").onclick = async () => { await api("/api/demo/pause", {}); refresh(); };
$("#watch").onclick = async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  if (b.dataset.act === "bars") { window.open(`/api/${BOOK}/bars/${encodeURIComponent(b.dataset.sym)}`, "_blank"); return; }
  if (b.dataset.v === "removed" && !confirm("Remove this symbol? Open tranches are closed at the last price.")) return;
  if (b.dataset.act === "flatten" && !confirm("Close all open tranches for this symbol at the last price?")) return;
  try { await api(bk(`/api/symbols/${b.dataset.id}/${b.dataset.act}`), b.dataset.act === "status" ? {status: b.dataset.v} : {}); }
  catch (err) { alert(err.message); }
  refresh();
};
document.querySelectorAll(".tabs button[data-tab]").forEach(b => b.onclick = () => { TAB = b.dataset.tab; renderTab(); });
$("#watch").onchange = async e => {
  const sel = e.target.closest("select.gradesel"); if (!sel || !sel.value) return;
  try { await api(bk(`/api/symbols/${sel.dataset.id}/grade`), {grade: sel.value}); } catch (err) { alert(err.message); }
  refresh();
};
$("#bookTabs").onclick = e => {
  const b = e.target.closest("button[data-book]"); if (!b || b.dataset.book === BOOK) return;
  BOOK = b.dataset.book; location.hash = BOOK; settingsDirty = false; STATE = null; refresh();
};
window.addEventListener("resize", () => STATE && renderChart(STATE.summary.curve, STATE.summary.starting_capital, STATE.broker.curve || []));

refresh();
setInterval(refresh, 5000);
</script>
</body>
